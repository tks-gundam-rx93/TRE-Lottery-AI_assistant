services:
  - name: tre-lottery-pr10-preview
    type: web
    runtime: python
    plan: free
    region: singapore
    branch: codex/lottery-voice-debug
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: LOTTERY_DB_BACKEND
        value: mysql
      - key: LOTTERY_DB_HOST
        fromService:
          type: web
          name: tre-lottery-ai-assistant
          envVarKey: LOTTERY_DB_HOST
      - key: LOTTERY_DB_PORT
        fromService:
          type: web
          name: tre-lottery-ai-assistant
          envVarKey: LOTTERY_DB_PORT
      - key: LOTTERY_DB_USER
        fromService:
          type: web
          name: tre-lottery-ai-assistant
          envVarKey: LOTTERY_DB_USER
      - key: LOTTERY_DB_PASSWORD
        fromService:
          type: web
          name: tre-lottery-ai-assistant
          envVarKey: LOTTERY_DB_PASSWORD
