[project]
name = "tre-lottery-ai-assistant"
version = "0.1.0"
description = "LOTO7 statistical analysis, deep learning research and three-agent review"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dl = ["torch>=2.2"]

[tool.setuptools.packages.find]
include = ["lottery_ai*"]